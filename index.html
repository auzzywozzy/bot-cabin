<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cabin Office</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>
  <div id="hud">
    <div class="hud-title">Cabin Office <span id="clock"></span></div>
    <div id="hud-rows"></div>
    <div class="hud-foot" id="hud-foot"></div>
  </div>
  <div id="fade"></div>
  <div id="spots" aria-label="Jump to"></div>
  <div id="bottombar">
    <div id="modebar" role="tablist" aria-label="View">
      <button type="button" role="tab" data-mode="outside">Outside</button>
      <button type="button" role="tab" data-mode="inside">Inside</button>
    </div>
    <button type="button" id="zoomchip" title="Lens: 0.5× ultrawide / 1×">0.5×</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
